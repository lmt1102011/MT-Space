<svg xmlns="http://www.w3.org/2000/svg" width="64" height="16" viewBox="0 0 64 16">
<!--
  The shot. The middle is fully solid so the shot keeps the same thickness
  as before - only the outermost pixels fade, so it still reads as a bolt
  of light instead of a soft blob.
-->
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
<stop offset="0.09" stop-color="#ffffff" stop-opacity="1"/>
<stop offset="0.91" stop-color="#ffffff" stop-opacity="1"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
</linearGradient>
</defs>
<rect fill="url(#g)" x="0" y="0" width="64" height="16"/>
</svg>
