<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
<!--
  The world grid: four 160px cells, every fourth line is brighter.
  The texture is repeated over the whole map, so the background costs a
  single draw call instead of a script redrawing lines every frame.
  The colours are written out directly: the SVG importer ignores CSS.
-->
<line stroke="#38524a" stroke-opacity="0.65" stroke-width="1" x1="160" y1="0" x2="160" y2="640"/>
<line stroke="#38524a" stroke-opacity="0.65" stroke-width="1" x1="320" y1="0" x2="320" y2="640"/>
<line stroke="#38524a" stroke-opacity="0.65" stroke-width="1" x1="480" y1="0" x2="480" y2="640"/>
<line stroke="#4d6e63" stroke-opacity="0.9" stroke-width="2" x1="0" y1="0" x2="0" y2="640"/>
<line stroke="#38524a" stroke-opacity="0.65" stroke-width="1" x1="0" y1="160" x2="640" y2="160"/>
<line stroke="#38524a" stroke-opacity="0.65" stroke-width="1" x1="0" y1="320" x2="640" y2="320"/>
<line stroke="#38524a" stroke-opacity="0.65" stroke-width="1" x1="0" y1="480" x2="640" y2="480"/>
<line stroke="#4d6e63" stroke-opacity="0.9" stroke-width="2" x1="0" y1="0" x2="640" y2="0"/>
</svg>
